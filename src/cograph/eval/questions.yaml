# ── Hard (10): Attack chain reasoning and cross-source synthesis ────────
- question: "Design a credential theft attack chain starting from initial access via phishing to domain admin, listing specific tools and techniques at each step."
  gold_answer: "1) Initial Access: Spearphishing Attachment T1566.001, 2) Execution: PowerShell T1059.001, 3) Credential Access: Kerberoasting T1558.003 using Rubeus, 4) Privilege Escalation: Pass the Ticket T1550.003 using Mimikatz, 5) Domain Admin: DCSync T1003.006 using Mimikatz to dump domain credentials."
  gold_entities: ["T1566.001", "T1059.001", "T1558.003", "T1550.003", "T1003.006", "S0002"]
  difficulty: hard

- question: "Compare the detection strategies for DCSync (T1003.006) vs Kerberoasting (T1558.003) and identify gaps."
  gold_answer: "DCSync detection relies on monitoring Directory Service Replication events (Event ID 4662) and network traffic for DRS-RPC calls. Kerberoasting detection focuses on anomalous TGS ticket requests (Event ID 4769). A gap exists in detecting Kerberoasting when attackers request tickets for common service accounts."
  gold_entities: ["T1003.006", "T1558.003"]
  difficulty: hard

- question: "Which techniques overlap between APT28 and APT29, and what defenses cover both groups?"
  gold_answer: "Overlapping techniques include credential dumping, spearphishing, and use of web protocols. Shared defenses include multi-factor authentication, network segmentation, and application whitelisting."
  gold_entities: ["G0007", "G0016"]
  difficulty: hard

- question: "Map the full kill chain for a ransomware attack using only LOLBins (no custom malware), from initial access to impact."
  gold_answer: "1) Initial Access: Mshta.exe for HTA execution, 2) Execution: Wmic.exe for process creation, 3) Persistence: Schtasks.exe for scheduled tasks, 4) Defense Evasion: Rundll32.exe for proxy execution, 5) Discovery: Nltest.exe for domain trust enumeration, 6) Lateral Movement: PsExec or WinRM, 7) Collection: Compress using makecab.exe, 8) Impact: cipher.exe for secure deletion."
  gold_entities: []
  difficulty: hard

- question: "What are all the prerequisite techniques an attacker needs before they can perform a Golden Ticket attack (T1558.001)?"
  gold_answer: "Prerequisites for Golden Ticket: 1) Credential Access to obtain the KRBTGT hash via DCSync (T1003.006) or NTDS.dit extraction (T1003.003), which requires Domain Admin privileges. Getting DA typically requires: initial credential theft (T1003.001), privilege escalation via Kerberoasting (T1558.003) or exploitation, and lateral movement (T1021) to reach a domain controller."
  gold_entities: ["T1558.001", "T1003.006", "T1003.003", "T1003.001", "T1558.003", "T1021"]
  difficulty: hard

- question: "Analyze which ATT&CK techniques have both Atomic Red Team test coverage AND LOLBAS binary implementations, and what this means for detection priorities."
  gold_answer: "Techniques like System Binary Proxy Execution (T1218) and its sub-techniques have both Atomic Red Team tests and LOLBAS binaries, meaning defenders can test detection using Atomic tests while knowing these techniques leverage built-in Windows tools that are hard to block."
  gold_entities: ["T1218"]
  difficulty: hard

- question: "For the Credential Access tactic, rank the techniques by the number of threat groups known to use them, and identify which ones lack mitigations."
  gold_answer: "Top credential access techniques by group usage include OS Credential Dumping (T1003), Brute Force (T1110), and Steal or Forge Kerberos Tickets (T1558). Techniques like Input Capture (T1056) may have fewer specific mitigations compared to well-studied techniques like Kerberoasting."
  gold_entities: ["TA0006", "T1003", "T1110", "T1558"]
  difficulty: hard

- question: "Construct a detection-in-depth strategy for protecting against Pass-the-Hash (T1550.002), covering each kill chain stage from initial credential theft to lateral movement."
  gold_answer: "1) Credential Theft Prevention: enable Credential Guard, restrict LSASS access, 2) Credential Use Detection: monitor NTLM authentication events (4624 Type 3), 3) Lateral Movement Detection: detect anomalous logon patterns, 4) Mitigation: disable NTLM where possible, enforce Kerberos, use Protected Users group, implement LAPS for local admin passwords."
  gold_entities: ["T1550.002", "M1026"]
  difficulty: hard

- question: "Which threat groups are most likely to target Active Directory infrastructure, and what is their common attack pattern?"
  gold_answer: "Groups targeting AD include APT29 (SolarWinds), FIN7, and Wizard Spider. Common pattern: phishing → credential access → Kerberoasting/DCSync → domain dominance. They share techniques like T1003 (credential dumping) and T1558 (Kerberos attacks)."
  gold_entities: ["G0016", "G0046", "T1003", "T1558"]
  difficulty: hard

- question: "Create a comprehensive mapping between D3FEND countermeasures and the top 10 most-used ATT&CK techniques, identifying which techniques have the weakest defensive coverage."
  gold_answer: "Top techniques by usage include T1059 (Command and Scripting Interpreter), T1055 (Process Injection), T1071 (Application Layer Protocol). Techniques like T1055 have strong process monitoring countermeasures, while T1071 is harder to defend against as it uses legitimate protocols. The weakest coverage exists for techniques that abuse built-in OS functionality."
  gold_entities: ["T1059", "T1055", "T1071"]
  difficulty: hard
